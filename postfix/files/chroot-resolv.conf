# Managed by pyinfra. Source: postfix/files/chroot-resolv.conf
#
# Static resolver config for postfix's chroot (/var/spool/postfix/etc/resolv.conf).
# Deliberately NOT a copy of /etc/resolv.conf.
#
# Why: postfix runs chrooted, so it reads its own copy of resolv.conf, and the
# stock ExecStartPre (/usr/lib/postfix/configure-instance.sh) snapshots
# /etc/resolv.conf into the chroot once, at daemon start, and never again.
# /etc/resolv.conf here is a symlink into /run/systemd/resolve/, whose content
# is transient: systemd-resolved rewrites it on every restart, and tailscaled
# restarts resolved whenever it reasserts MagicDNS.
#
# On 2026-08-27 an unattended-upgrade of openssl triggered a systemd
# daemon-reexec that restarted systemd-networkd, systemd-resolved (twice, 104ms
# apart) and postfix, all within the same second. Postfix snapshotted a
# resolv.conf that resolved had just written but not yet populated with
# nameservers. glibc's fallback for "no nameserver" is 127.0.0.1:53 -- which on
# this host is Knot, authoritative-only, answering REFUSED to everything outside
# its zones. Postfix maps REFUSED to "Host not found, try again" (4.4.3), so
# every remote delivery deferred, gmail.com included, for 23 hours until a
# manual `systemctl restart postfix` re-took the snapshot.
#
# Pinning the file decouples postfix's resolver from resolved's restart timing
# entirely. Nothing here needs to change when tailscale or DHCP churn.
#
# Server choice: glibc honors only the first 3 nameserver lines (MAXNS), so
# these three are the whole list -- picked one per failure domain.
#   173.230.145.5  Linode recursive, on-net (sub-ms), same resolver DHCP hands
#                  the host. First because it is closest and because public
#                  resolvers are blocked by most DNSBLs (Spamhaus returns an
#                  error code to queries from 8.8.8.8/1.1.1.1). main.cf has no
#                  reject_rbl_client today, but keeping a DNSBL-eligible
#                  resolver as primary leaves that door open.
#   1.1.1.1        Cloudflare, standby.
#   8.8.8.8        Google, standby. Different company, network and anycast
#                  footprint from Cloudflare, so the two are unlikely to fail
#                  together.
# IPv4 only: with MAXNS=3 every v6 entry would displace a v4 one, and v4
# reachability to all three is not in question. inet_protocols=all still governs
# what postfix does with the *answers*.
#
# glibc tries servers in order, so #2 and #3 are only reached after #1 times
# out; timeout:2 keeps that failover under the SMTP client's patience rather
# than the 5s default. No `rotate` -- primary should stay deterministic.

nameserver 173.230.145.5
nameserver 1.1.1.1
nameserver 8.8.8.8

options timeout:2 attempts:2
