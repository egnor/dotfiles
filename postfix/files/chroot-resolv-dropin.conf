# Managed by pyinfra. Source: postfix/files/chroot-resolv-dropin.conf
#
# Make postfix use our static chroot resolv.conf instead of a snapshot of
# /etc/resolv.conf. See postfix/files/chroot-resolv.conf for the full story.
#
# The stock postfix@.service runs exactly one ExecStartPre:
#   ExecStartPre=/usr/lib/postfix/configure-instance.sh %i
# which unconditionally does `rm -f etc/resolv.conf && cp /etc/resolv.conf ...`
# inside the queue directory. We can't stop that without forking the unit, but
# systemd runs ExecStartPre lines in the order declared and drop-ins append to
# the list, so this one lands after the snapshot and overwrites it -- still
# before ExecStart, and therefore before any smtp(8) child reads it.
#
# Deliberately not solved by enabling postfix-resolvconf.path (shipped disabled
# by the package): that watches /etc/resolv.conf and reloads postfix on change,
# which would have shortened this outage but not prevented it, and it makes
# postfix's resolver config a function of resolved's restart timing -- exactly
# the coupling we are removing.

[Service]
ExecStartPre=/usr/bin/install -m 644 -o root -g root /etc/postfix/chroot-resolv.conf /var/spool/postfix/etc/resolv.conf
