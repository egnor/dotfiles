# Managed by pyinfra. Source: dotfiles/mosquitto/files/egnor_mqtt.conf

# Resource caps
max_packet_size 1048576
max_queued_bytes 1048576
max_queued_messages 100
memory_limit 134217728
persistence false

# TLS-only, no plaintext listener. The cert files are moquitto-readable copies,
# updated by /etc/letsencrypt/renewal-hooks/deploy/mosquitto-install-certs.
listener 8883
allow_anonymous false
password_file /etc/mosquitto/conf.d/egnor_mqtt.passwd
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
