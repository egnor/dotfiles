# Managed by pyinfra. Source: dotfiles/mosquitto/files/egnor_mqtt.conf

# Resource caps. max_packet_size is small on purpose: embedded clients have
# tiny receive buffers, and rejecting oversized publishes at the broker beats
# having the client choke on them.
max_packet_size 65536
max_queued_bytes 1048576
max_queued_messages 100
memory_limit 134217728
persistence false

# TLS-only, no plaintext listener. The cert files are mosquitto-readable copies,
# updated by /etc/letsencrypt/renewal-hooks/deploy/mosquitto-install-certs.
# allow_anonymous and password_file are global (per_listener_settings is off),
# but certfile/keyfile are per-listener and so repeat under each one.
allow_anonymous false
password_file /etc/mosquitto/conf.d/egnor_mqtt.passwd

# mqtts://mqtt.eacs.io:8883
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# wss://mqtt.eacs.io:8884 (browsers and other WebSocket-only clients)
listener 8884
protocol websockets
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
