# Managed by pyinfra. Source: dotfiles/mosquitto/files/egnor_1883.conf

# Resource caps. `persistence false` overrides the `persistence true` in
# the package's /etc/mosquitto/mosquitto.conf — conf.d/ is include_dir'd
# last, so the drop-in wins. Nothing here needs to survive a restart.
max_packet_size 1048576
max_queued_bytes 1048576
max_queued_messages 100
memory_limit 134217728
persistence false

# Plaintext MQTT, reachable from the public internet (all interfaces).
# Credentials cross the wire in the clear on this listener — see CLAUDE.md
# "Mosquitto MQTT broker" for the password workflow and the TLS plan.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/conf.d/egnor_1883.passwd
