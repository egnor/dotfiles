# Managed by pyinfra. Source: dotfiles/tweaks/files/sshd-brute-force.conf
#
# Keeps password-guessing bots from locking out real logins. sshd drops new
# connections at random once MaxStartups unauthenticated sessions are pending;
# at the stock 10:30:100, with 40-90k guesses/day (2026-09), that meant
# throttling episodes of up to an hour in which about one real login in three
# failed with "kex_exchange_identification: Connection closed by remote host".
# Evidence is in auth.log: "drop connection #N ... past MaxStartups" and
# "exited MaxStartups throttling after ..., N connections dropped".
#
# sshd uses the FIRST value it sees for each keyword, and the stock
# sshd_config Includes this directory on its first line, so values here
# override anything set below that line (notably its "PermitRootLogin yes").

# Observed peak was 22 pending sessions, so 50 before any drops is ample.
MaxStartups 50:30:200
# One source address can hold at most this many pending sessions.
PerSourceMaxStartups 3
# A stalled pre-auth connection holds its slot this long (stock: 120).
LoginGraceTime 30
# MaxAuthTries stays at the stock 6 on purpose: every key an agent offers
# counts as a try, so a low cap cuts off a borrowed laptop with a few keys
# loaded before it ever reaches the password prompt.

# Passwords are off for everyone but egnor, who wants a way in from a
# borrowed machine with no key. Bots do guess "egnor" (about 1% of attempts)
# so this is a deliberate, bounded exposure, not an oversight. Everyone else,
# root included, is key-only; a bot that is offered no password method
# disconnects right after key exchange instead of holding a slot.
PermitRootLogin prohibit-password
PasswordAuthentication no

# PerSourcePenalties (OpenSSH 9.8+) is the built-in fix for all of this and
# would replace most of the above; Ubuntu 24.04 has 9.6.

# Keep Match last: it applies to every line after it in this file.
Match User egnor
    PasswordAuthentication yes
