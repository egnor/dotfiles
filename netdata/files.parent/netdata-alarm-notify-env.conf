# Managed by pyinfra. Source: dotfiles/netdata/files.parent/netdata-alarm-notify-env.conf
# Environment for netdata, inherited by alarm-notify.sh when netdata execs it.
#
# clear_alarm_always makes alarm-notify.sh send the CLEAR notification even
# when the previous status was not WARNING/CRITICAL. Without it, a raised alert
# whose instance is rebuilt -- netdata restart, or a child rebooting and its
# charts being obsoleted -- goes WARNING -> REMOVED -> UNINITIALIZED -> CLEAR,
# and the final leg is dropped at alarm-notify.sh:366 because old_status is
# UNINITIALIZED rather than WARNING. The raise is then never superseded and
# sits on the phone as a permanently red ntfy card. That is what stranded roc's
# "system post update reboot status" on 2026-08-26.
#
# This MUST be an environment variable, not a health_alarm_notify.conf setting:
# the check runs at line 366, but that config is not sourced until line 519, so
# a value set there is never in scope. The stock config advertises the option
# anyway, which is a trap.
#
# Safe here specifically because custom_sender() keys one ntfy card per
# host+chart+name via X-Sequence-ID, so a redundant CLEAR updates the existing
# card rather than adding one -- which is the condition the stock config names
# ("if your system makes deduplication for alarms").
[Service]
Environment="clear_alarm_always=YES"
