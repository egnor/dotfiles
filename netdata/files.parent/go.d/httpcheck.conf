# Managed by pyinfra. Source: dotfiles/netdata/files.parent/go.d/httpcheck.conf
#
# Generic HTTP endpoint checks for static sites.
# Uses stock alerting from (netdata install)/health.d/httpcheck.conf

jobs:
  # --- Drain Teaser: 200-OK static sites ---
  - name: blackletterlabs
    url: https://blackletterlabs.com
  - name: shop_seventeengames
    url: https://shop.seventeengames.com
  - name: seventeengames_scan
    url: https://seventeengames.com/scan.html

  # --- Drain Teaser: redirect rules ---
  # 17g.io/ -> shop.seventeengames.com/ (short-circuits past seventeengames.com)
  - name: redirect_17g_io_root
    url: https://17g.io/
    not_follow_redirects: yes
    status_accepted: [301]
    header_match:
      - key: Location
        value: '= https://shop.seventeengames.com/'

  # seventeengames.com/ -> shop.seventeengames.com/
  - name: redirect_seventeengames_root
    url: https://seventeengames.com/
    not_follow_redirects: yes
    status_accepted: [301]
    header_match:
      - key: Location
        value: '= https://shop.seventeengames.com/'

  # 17g.io/<id> -> seventeengames.com/scan.html?id=<id>
  - name: redirect_17g_io_scan
    url: https://17g.io/probe
    not_follow_redirects: yes
    status_accepted: [301]
    header_match:
      - key: Location
        value: '= https://seventeengames.com/scan.html?id=probe'

  # --- Nutrimatic (migrated from uptimerobot) ---
  # Both query URLs go through fcgiwrap to cgi-search.py against the
  # respective prod-*.index, so a 200 here is an end-to-end check of
  # nginx + fcgiwrap + the index files, not just static content.
  - name: nutrimatic_2016
    url: https://nutrimatic.org/2016/?q=test
  - name: nutrimatic_2024
    url: https://nutrimatic.org/2024/?q=test

  # nutrimatic.org/ -> nutrimatic.org/2024/ (302, not 301: the nginx
  # rewrite uses the `redirect` flag rather than `permanent`).
  - name: redirect_nutrimatic_root
    url: https://nutrimatic.org/
    not_follow_redirects: yes
    status_accepted: [302]
    header_match:
      - key: Location
        value: '= https://nutrimatic.org/2024/'
