# Managed by pyinfra. Source: dotfiles/netdata/files.parent/health.d/httpcheck.conf
# Per-template overrides for stock httpcheck alerts.
#
# Anti-flap here is status-variable HYSTERESIS in the expressions, not a
# notification delay. `$status` is this alert instance's current status, so
# the thresholds can differ depending on which way we are crossing them:
# raise at >=20% bad responses, but do not clear until <15%; go critical at
# >=40%, but do not fall back to warning until <35%. A Schmitt trigger.
#
# That matters because the `average -5m` lookup damps a single 500 among many
# 200s but does NOT prevent boundary wobble: at `every: 10s` against a 5-minute
# trailing window, consecutive evaluations share ~98% of their data, so an
# endpoint sitting at a steady ~20% error rate drifts back and forth across a
# flat threshold indefinitely. Hysteresis stops the state change at the source.
#
# A `delay: down` would instead hide flapping AFTER the state has already
# changed, and it carries a real cost: the clear notification waits in
# netdata's in-memory queue, and a netdata restart inside that window drops it.
# Since our ntfy sender keys one card per alert instance via X-Sequence-ID, the
# raise is then never superseded and sits on the phone as a permanently red
# card. That happened to iap_prober_stale on 2026-08-25 -- it raised, cleared
# 90s later behind a `down 5m` delay, and the host rebooted 4 minutes before
# the clear came due. So: no delay lines here; let hysteresis do the work.
# (`multiplier`/`max` were especially bad, stretching that window toward an
# hour on exactly the endpoints most likely to flap.)
#
# The same $status idiom is used by the stock templates in web_log.conf.

# Replacement for default template that filters out noisy endpoints
    template: httpcheck_web_service_bad_status
          on: httpcheck.status
       class: Workload
        type: Web Server
   component: HTTP endpoint
chart labels: url=!https://shop.seventeengames.com *
      lookup: average -5m unaligned percentage of bad_status
       every: 10s
       units: %
        warn: $this >= (($status >= $WARNING)  ? (15) : (20)) AND $this < (($status == $CRITICAL) ? (35) : (40))
        crit: $this >= (($status == $CRITICAL) ? (35) : (40))
     summary: HTTP check for ${label:url} unexpected status
        info: Percentage of HTTP responses from ${label:url} with unexpected status in the last 5 minutes
          to: webmaster

# Alert for noisy endpoints not included above; has a much larger delay
    template: httpcheck_web_service_bad_status_noisy_endpoints
          on: httpcheck.status
       class: Workload
        type: Web Server
   component: HTTP endpoint
chart labels: url=https://shop.seventeengames.com
      lookup: average -30m unaligned percentage of bad_status
       every: 30s
       units: %
        warn: $this >= (($status >= $WARNING)  ? (15) : (20)) AND $this < (($status == $CRITICAL) ? (35) : (40))
        crit: $this >= (($status == $CRITICAL) ? (35) : (40))
     summary: HTTP check for ${label:url} unexpected status
        info: Percentage of HTTP responses from ${label:url} with unexpected status in the last 30 minutes
          to: webmaster
