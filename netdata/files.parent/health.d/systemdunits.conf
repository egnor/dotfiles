# Managed by pyinfra. Source: dotfiles/netdata/files.parent/health.d/systemdunits.conf
#
# Alert on any systemd service unit in the "failed" state, fleet-wide.
# Netdata ships this template but with `chart labels: unit_name=!*`.
#
# Two templates on the same chart, split by unit name. The first excludes the
# units listed in the second; the second re-matches just those and delays the
# notification by a week, so a failure that clears sooner never notifies.
# Add a unit to BOTH lines to move it to the slow lane. Simple-pattern rules:
# space-separated, `!` negates, first match wins, so the `*` goes last.

    template: systemd_service_unit_failed_state
          on: systemd.service_unit_state
       class: Errors
        type: Linux
   component: Systemd units
chart labels: unit_name=!apport-autoreport *
        calc: $failed
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
     summary: systemd unit ${label:unit_name} failed
        info: systemd service unit ${label:unit_name} is in the failed state
          to: sysadmin

# Units whose failure is not our problem in the short term -- apport-autoreport
# fails whenever Ubuntu's error tracker is down -- but that shouldn't stay
# failed indefinitely either.
    template: systemd_service_unit_failed_week
          on: systemd.service_unit_state
       class: Errors
        type: Linux
   component: Systemd units
chart labels: unit_name=apport-autoreport
        calc: $failed
       units: state
       every: 10s
        warn: $this != nan AND $this == 1
       delay: up 7d
     summary: systemd unit ${label:unit_name} failed for a week
        info: systemd service unit ${label:unit_name} has been in the failed state for a week
          to: sysadmin
